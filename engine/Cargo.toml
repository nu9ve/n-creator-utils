# Motor de nüün en Rust (adoptado 2026-11-09, docs/platforms/rust-engine.md).
# Python (`media/`) es el oráculo hasta la paridad de cada método: mismo protocolo `rpc-serve`, mismo sobre
# `{ok, data | error}`, mismos códigos de error y el mismo JSON canónico para los digests.
# Convenciones de la suite (las de nove y curado): edition 2024, fmt + clippy -D warnings, pruebas con raíces
# temporales y nunca discos personales, dependencias fijadas y anotadas con su razón.
[workspace]
members = ["crates/nuun-recipe", "crates/nuun-media", "nuun-engine"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "UNLICENSED"
publish = false

# `nu9ve-json` vive en nu9ve/core y llega por su copia fijada (vendor/nu9ve-core/rust/nu9ve-json, sync-core.sh).
[workspace.dependencies]
nu9ve-json = { path = "../vendor/nu9ve-core/rust/nu9ve-json" }
# `nu9ve-volumes` se mudó a nu9ve/core el 2026-11-22 (rust/nu9ve-volumes); llega por la misma copia fijada.
nu9ve-volumes = { path = "../vendor/nu9ve-core/rust/nu9ve-volumes" }
# `nu9ve-time` se mudó a nu9ve/core el 2026-11-26 (rust/nu9ve-time, sobre jiff en lugar de chrono); llega por la
# misma copia fijada. La hora local sigue saliendo de `localtime_r` en Mac, como en Python.
nu9ve-time = { path = "../vendor/nu9ve-core/rust/nu9ve-time" }
# El binario `nu9ve` del agente de la suite (nu9ve-agent-v1) y su biblioteca, de la misma copia fijada. nüün lo
# lleva en su bundle para `nu9ve agent state` e `install --by nuun`, y usa sus reglas para saber si el agente
# está; nunca corre su `serve`. Se compila con este Cargo.lock: `cargo build -p nu9ve-mcp --bin nu9ve`.
nu9ve-mcp = { path = "../vendor/nu9ve-core/rust/nu9ve-mcp" }
# Perfiles en esta máquina (nu9ve-profile-v1): leer profiles.json y escribir sólo la entrada `nuun`, con su candado.
# Escritura atómica de los escaneos de acumulados (nu9ve-fs-v1); ya llega con nu9ve-volumes.
nu9ve-fs = { path = "../vendor/nu9ve-core/rust/nu9ve-fs" }
nu9ve-profiles = { path = "../vendor/nu9ve-core/rust/nu9ve-profiles" }
# Registro de benchmarks (nu9ve-bench-v1): `nuun-engine bench` agrega corridas a bench/nuun.ndjson.
nu9ve-bench = { path = "../vendor/nu9ve-core/rust/nu9ve-bench" }
# Las mismas versiones que nove/core y curado (ya en la caché local; ninguna descarga nueva).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Las condiciones `dcim_regex` de la receta son datos que la persona podrá editar: hace falta un motor real.
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
# Sony sidecar XML (`camera_evidence`): the same version nove uses.
quick-xml = "0.42"
# IANA offsets for Stalker evidence, with bundled rules on Windows.
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
libc = "0.2.191"
# `slug` normaliza a NFC antes de limpiar, como `unicodedata.normalize('NFC')` de Python: un nombre en NFD
# (una carpeta de HFS+) daba `N-andu` en vez de `Ñandú`. Lo encontraron los vectores de nombres (2026-11-27).
unicode-normalization = "0.1.21"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
