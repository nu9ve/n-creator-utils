[package]
name = "nuun-media"
description = "nüün's media domain in Rust: read-only catalog, volume rules and source cards (port of media/catalog.py and media/volumes.py)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nu9ve-json.workspace = true
nu9ve-volumes.workspace = true
# The suite agent's own rules (nu9ve-agent-v1): its folder, whether `agent.json` is valid.
nu9ve-mcp.workspace = true
# profiles.json (nu9ve-profile-v1): qué perfiles hay y en qué apps; nüün sólo escribe su clave `nuun`.
nu9ve-profiles.workspace = true
# Escaneos de acumulados: un archivo por escaneo, escrito de forma atómica.
nu9ve-fs.workspace = true
nuun-recipe = { path = "../nuun-recipe" }
nu9ve-time.workspace = true
sha2.workspace = true
serde_json.workspace = true
# The catalog is SQLite (media/catalog.py). `bundled`: the same version on every OS, as nove does.
rusqlite.workspace = true
quick-xml.workspace = true
# closure.py names (`delivery_title`, vertical suffixes, dates in a name) are regular expressions in Python.
regex.workspace = true
# `slug` en NFC, como Python (docs/contracts/examples/media-naming-vectors-v1.json).
unicode-normalization.workspace = true

# storage_index.py `_alive`: whether a scan's process still runs (`kill(pid, 0)`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Cooperative cancellation of one-shot workers through a named event (interrupt.rs), as nove signals its host.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
