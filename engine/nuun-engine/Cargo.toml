[package]
name = "nuun-engine"
description = "nüün's engine in Rust: the same rpc-serve protocol as media/cli.py, method by method"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nu9ve-json = { path = "../crates/nu9ve-json" }
nuun-recipe = { path = "../crates/nuun-recipe" }
nuun-media = { path = "../crates/nuun-media" }
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
# The reads golden loads Python's fixture catalog from SQL (already a dependency of nuun-media).
rusqlite.workspace = true
# The writes golden normalizes times (`now`) with Python's own pattern.
regex.workspace = true
