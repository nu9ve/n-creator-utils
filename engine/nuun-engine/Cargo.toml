[package]
name = "nuun-engine"
description = "nüün's engine in Rust: the same rpc-serve protocol as media/cli.py, method by method"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Shared RPC transport and exact wire ids (serde_json raw_value).
nu9ve-engine = { path = "../../vendor/nu9ve-core/rust/nu9ve-engine", version = "=0.1.0" }
nu9ve-json.workspace = true
nuun-recipe = { path = "../crates/nuun-recipe" }
nuun-media = { path = "../crates/nuun-media" }
# `raw_value`: the digits of an integer id beyond 64 bits (nu9ve-engine-v1 §2.1), without `arbitrary_precision`,
# which would change what `nu9ve-json` reads (nu9ve-json-v1 §8). It only adds `RawValue`; `Value` reads the same.
serde_json = { workspace = true, features = ["raw_value"] }
# The suite transport (nu9ve-registry-v1): the engine record, liveness and the current uid.
nu9ve-ipc = { path = "../../vendor/nu9ve-core/rust/nu9ve-ipc", version = "=0.1.0" }

# The peer uid of each suite connection (`getpeereid`, nu9ve-engine-v1 §9).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
# The reads golden loads Python's fixture catalog from SQL (already a dependency of nuun-media).
rusqlite.workspace = true
# The writes golden normalizes times (`now`) with Python's own pattern.
regex.workspace = true
