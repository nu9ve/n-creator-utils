[package]
name = "nu9ve-ipc"
description = "Engine registry (nu9ve-registry-v1) and a local framed client for nu9ve-engine-v1 sockets"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[dependencies]
# Writes the record with a sibling temporary and rename (nu9ve-fs-v1).
nu9ve-fs = { path = "../nu9ve-fs", version = "=0.1.0" }
# Error type and random request ids; nu9ve-fs needs it too.
nu9ve-json = { path = "../nu9ve-json", version = "=0.1.0" }
# Reads and writes the record and the frames.
serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
# Process start time and owner, socket peer uid.
libc = "=0.2.191"

[dev-dependencies]
# Isolated registry folders for the tests.
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
